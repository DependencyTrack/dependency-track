version: 2
updates:
  #
  # main branch
  #
  - package-ecosystem: maven
    commit-message:
      # Disable "chore(deps):" prefixes.
      prefix: ""
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    commit-message:
      prefix: ""
    directory: /apiserver/src/main/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # We commit to the latest LTS release of the JDK,
      # non-LTS releases should not be suggested.
      - dependency-name: "eclipse-temurin"
        update-types:
          - version-update:semver-major
      # cyclonedx-core-java still requires version 2.x,
      # we can't upgrade to 3.x until the CycloneDX lib moves.
      - dependency-name: "com.networknt:json-schema-validator"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    commit-message:
      prefix: ""
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  #
  # 5.2.x maintenance branch
  #
  - package-ecosystem: maven
    target-branch: 5.2.x
    commit-message:
      prefix: ""
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    target-branch: 5.2.x
    commit-message:
      prefix: ""
    directory: /apiserver/src/main/docker
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    target-branch: 5.2.x
    commit-message:
      prefix: ""
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  #
  # 4.14.x maintenance branch
  #
  - package-ecosystem: maven
    target-branch: 4.14.x
    commit-message:
      prefix: ""
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
    - dependency-name: "*"
      update-types:
      - version-update:semver-major
  - package-ecosystem: docker
    target-branch: 4.14.x
    commit-message:
      prefix: ""
    directory: /src/main/docker
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
    - dependency-name: "*"
      update-types:
      - version-update:semver-major
  - package-ecosystem: github-actions
    target-branch: 4.14.x
    commit-message:
      prefix: ""
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
