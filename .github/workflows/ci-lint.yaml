name: Lint

on:
  push:
    branches:
      - 'main'            # Main branch
      - 'feature-**'      # Feature branch
      - '[0-9]+.[0-9]+.x' # Release branches
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - 'main'            # Main branch
      - 'feature-**'      # Feature branch
      - '[0-9]+.[0-9]+.x' # Release branches
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: { }

jobs:
  lint-java:
    name: Lint Java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # tag=v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-repository-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-repository-
      - name: Lint
        run: make lint-java

  lint-protobuf:
    name: Lint Protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Lint Protobuf
        run: make lint-proto

  protobuf-breaking-changes:
    name: Protobuf Breaking Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Breaking Changes
        run: make lint-proto-breaking BASE_REF=HEAD^1

  lint-openapi:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Lint OpenAPI Spec
        run: make lint-openapi

  lint-migrations:
    name: Lint Migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch base ref
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}"
      - name: Lint changed migrations
        run: make lint-migrations
      - name: Lint changed dex migrations
        run: make lint-dex-migration

  openapi-breaking-changes:
    name: OpenAPI Breaking Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Breaking Changes
        run: make lint-openapi-breaking BASE_REF=HEAD^1

  lint-gha:
    name: Lint GitHub Actions
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
