name: Report PR Test Coverage

# NB: `workflow_run` is required to access secrets for coverage reporting of pull requests from forks.
# No untrusted code is checked out or executed. Only the coverage report of the triggering run is consumed.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
    - Tests CI
    types:
    - completed

permissions: { }

jobs:
  publish:
    name: Report Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |-
      github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success'
    steps:
    - name: Fetch PR commit tree
      env:
        COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |-
        git init -q
        git fetch -q --depth=1 --filter=blob:none "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${COMMIT_SHA}"
    - name: Download PR coverage report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
      with:
        name: pr-coverage-report
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: Report Coverage to Codacy
      uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # tag=v1.3.0
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        language: Java
        coverage-reports: jacoco.xml
