type: object
properties:
  id:
    type: integer
    format: int64
  purl:
    type: string
  group:
    type: string
  name:
    type: string
  version:
    type: string
  license:
    type: string
    description: SPDX license ID or custom license name of the override
  declared_license:
    type: string
    description: The BOM-declared license the override replaced (snapshot from the last upload)
  details:
    type: string
required:
  - id
  - name
