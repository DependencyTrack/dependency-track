type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  description:
    type: string
  author:
    type: string
  enabled:
    type: boolean
  priority:
    type: integer
    format: int32
    description: Evaluation order, ascending; first matching policy wins
  condition:
    type: string
    description: CEL expression over component, project, now
  license:
    type: string
    description: SPDX license ID or custom license name applied on match
  details:
    type: string
  valid_from:
    type: string
    format: date-time
    description: Policy applies only from this time on
  valid_until:
    type: string
    format: date-time
    description: Policy applies only until this time
required:
  - id
  - name
  - enabled
  - priority
  - condition
