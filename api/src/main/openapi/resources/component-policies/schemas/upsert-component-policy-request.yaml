type: object
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
  enabled:
    type: boolean
    default: true
  priority:
    type: integer
    format: int32
    default: 0
  condition:
    type: string
    minLength: 1
    description: CEL expression over component, project, now
  license:
    type: string
    description: SPDX license ID or custom license name applied on match
  details:
    type: string
    description: Free-text note written onto matched components
  valid_from:
    type: string
    format: date-time
    description: Policy applies only from this time on
  valid_until:
    type: string
    format: date-time
    description: Policy applies only until this time
required:
  - name
  - condition
