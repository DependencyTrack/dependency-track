get:
  operationId: getPublicSystemCapabilities
  summary: Get public system capabilities
  description: |-
    Returns the capabilities of the system that clients need before they authenticate,
    for example to decide which login methods to offer.

    The response has the same shape as `GET /internal/system-capabilities`, but only contains
    namespaces that are public. Authenticated clients receive these namespaces from
    `GET /internal/system-capabilities` as well.
  tags:
    - System Capabilities
  security: []
  responses:
    "200":
      description: Public system capabilities
      content:
        application/json:
          schema:
            $ref: "./schemas/system-capabilities-response.yaml"
          example:
            capabilities:
              oidc:
                disabled: false
    default:
      $ref: "../../../shared/responses/generic-error.yaml"
