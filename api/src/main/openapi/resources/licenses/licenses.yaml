get:
  operationId: listComponentLicenses
  summary: Retrieves a list of all licenses for a given component.
  description: |-
    Retrieves a list of all licenses for a given component.

    Requires permission `VIEW_PORTFOLIO`
  tags:
    - Licenses
  parameters:
    - name: uuid
      in: path
      description: The UUID of the component to retrieve licenses for
      required: true
      schema:
        type: string
        format: uuid
    - $ref: "../../shared/parameters/pagination-limit.yaml"
    - $ref: "../../shared/parameters/page-token.yaml"
  responses:
    "200":
      description: A list of licenses for the given component UUID
      content:
        application/json:
          schema:
            $ref: "./schemas/list-licenses-response.yaml"
    "400":
      description: Bad Request
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: "../../shared/schemas/invalid-sort-field-problem-details.yaml"
              - $ref: "../../shared/schemas/problem-details.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
