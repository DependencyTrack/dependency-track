type: object
description: A license associated with a component.
properties:
  resolved_license:
    $ref: "../../../shared/schemas/license.yaml"
  license:
    type: string
    description: License name when the license could not be resolved.
    maxLength: 255
  license_expression:
    type: string
    description: SPDX license expression.
  license_url:
    type: string
    format: uri
    description: URL associated with the license.
    maxLength: 255
  ordinality:
    type: integer
    format: int64
    minimum: 1
    description: Position of the license in the source BOM.
  acknowledgement:
    type: string
    description: Whether the license has been declared or concluded.
required:
  - ordinality
  - acknowledgement