type: object
properties:
  grant_type:
    type: string
    description: The grant type. Only `urn:ietf:params:oauth:grant-type:token-exchange` is supported.
    maxLength: 64
    example: urn:ietf:params:oauth:grant-type:token-exchange
  subject_token:
    type: string
    description: The token to exchange. Required for the token exchange grant. At most 16 KiB.
    maxLength: 16384
  subject_token_type:
    type: string
    description: >-
      The type of the subject token. Required for the token exchange grant.
      `urn:ietf:params:oauth:token-type:jwt` for all workload identity providers,
      or `urn:ietf:params:oauth:token-type:id_token` for `OIDC` providers.
    maxLength: 64
    example: urn:ietf:params:oauth:token-type:jwt
  requested_token_type:
    type: string
    description: >-
      The type of token to issue. Optional. Only `urn:ietf:params:oauth:token-type:access_token` is supported.
    maxLength: 64
    example: urn:ietf:params:oauth:token-type:access_token
  workload_identity_provider:
    $ref: "../../../shared/schemas/workload-identity-provider-name.yaml"
  service_account:
    $ref: "../../../shared/schemas/service-account-name.yaml"
required:
- grant_type
