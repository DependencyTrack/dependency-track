type: object
properties:
  access_token:
    type: string
    description: An access token.
    maxLength: 8192
  issued_token_type:
    type: string
    description: Always `urn:ietf:params:oauth:token-type:access_token`.
    maxLength: 64
    example: urn:ietf:params:oauth:token-type:access_token
  token_type:
    type: string
    description: Always `Bearer`.
    maxLength: 32
    example: Bearer
  expires_in:
    type: integer
    format: int32
    description: >-
      How many seconds the access token is valid for.
      For token exchange, this is the workload identity provider's `session_lifetime_seconds`.
    minimum: 60
    maximum: 86400
    example: 3600
required:
- access_token
- issued_token_type
- token_type
- expires_in
