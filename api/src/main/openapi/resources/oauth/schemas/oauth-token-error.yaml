type: object
properties:
  error:
    type: string
    description: The RFC 6749 error code, either `invalid_request` or `unsupported_grant_type`.
    maxLength: 64
    example: invalid_request
  error_description:
    type: string
    description: A short, generic description of the error.
    maxLength: 256
required:
- error
