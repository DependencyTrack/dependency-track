get:
  operationId: getProjectDependencyGraph
  summary: Get project dependency graph
  description: |-
    Retrieves the entire dependency graph of a given project.

    `nodes` contains the project itself, and all of its components and services,
    including those that are not reachable from the project.

    Exactly one node has the type `PROJECT`. Its UUID is the UUID of the requested project.
    Every UUID in a `direct_dependencies` array refers to an item in `nodes`.
    Note that the graph may contain cycles.

    Requires permission `VIEW_PORTFOLIO`.
  tags:
    - Projects
  parameters:
    - name: uuid
      in: path
      description: The UUID of the project to retrieve the dependency graph for
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The dependency graph of the project
      content:
        application/json:
          schema:
            $ref: "./schemas/get-project-dependency-graph-response.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
