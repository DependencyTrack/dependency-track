get:
  operationId: getProjectOriginalBom
  summary: Retrieves the original BOM for a project.
  description: |-
    Retrieves the newest successfully imported BOM for which the original
    document was retained.

    Requires permission `VIEW_PORTFOLIO`
  tags:
    - Projects
  parameters:
    - name: uuid
      in: path
      description: The UUID of the project
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Original BOM document
      headers:
        Content-Disposition:
          description: Indicates that the BOM should be downloaded as a file
          schema:
            type: string
          example: 'attachment; filename="bom.json"'
      content:
        application/vnd.cyclonedx+json:
          schema:
            type: object
        application/vnd.cyclonedx+xml:
          schema:
            type: string
            format: binary
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
