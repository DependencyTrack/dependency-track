type: object
properties:
  uuid:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - PROJECT
      - COMPONENT
      - SERVICE
  group:
    type: string
    maxLength: 255
  name:
    type: string
    maxLength: 255
  version:
    type: string
    maxLength: 255
  direct_dependencies:
    type: array
    description: >-
      UUIDs of the nodes this node directly depends on.
      An empty array does not mean the node has no dependencies, only that none are known.
      Always empty for services, because their dependencies are not stored.
    items:
      type: string
      format: uuid
required:
  - uuid
  - type
  - name
  - direct_dependencies
