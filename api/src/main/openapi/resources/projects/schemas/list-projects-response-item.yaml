type: object
properties:
  uuid:
    type: string
    format: uuid
  name:
    type: string
    maxLength: 255
  version:
    type: string
    maxLength: 255
  group:
    type: string
    maxLength: 255
  classifier:
    $ref: "../../../shared/schemas/classifier.yaml"
  is_latest:
    type: boolean
  is_active:
    $ref: "../../../shared/schemas/project-state.yaml"
  last_bom_import:
    $ref: "../../../shared/schemas/timestamp.yaml"
  last_bom_import_format:
    type: string
    maxLength: 255
  last_inherited_risk_score:
    type: number
    format: double
  tags:
    type: array
    description: Tag names assigned to the project. Empty when no tags are assigned.
    items:
      type: string
  collection_logic:
    type: string
    enum:
      - AGGREGATE_DIRECT_CHILDREN
      - AGGREGATE_DIRECT_CHILDREN_WITH_TAG
      - AGGREGATE_LATEST_VERSION_CHILDREN
  collection_tag:
    type: string
    description: Tag name used by collection logic, when applicable.
  teams:
    type: array
    description: >-
      Teams with access to the project. Only present when `expand=teams` is requested.
      Empty array when expanded and no teams are assigned.
    items:
      type: object
      properties:
        name:
          type: string
      required:
        - name
  parent:
    $ref: "../../../shared/schemas/component-project.yaml"
  has_children:
    type: boolean
    description: >-
      Whether the project has at least one direct child. When portfolio access control is disabled, this reflects all direct
      children in the database.
  metrics:
    $ref: "./project-metrics.yaml"
required:
  - uuid
  - name
  - is_latest
  - has_children
