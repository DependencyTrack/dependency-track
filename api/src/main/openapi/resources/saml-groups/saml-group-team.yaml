put:
  operationId: updateSamlGroupMapping
  summary: Map a SAML group to a team
  description: |-
    Maps a SAML group to a team. Succeeds when the mapping already exists.
    With team synchronization enabled, members of the group are added to the team on their next login.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_UPDATE` permission.
  tags:
    - SAML Groups
  parameters:
    - name: uuid
      in: path
      description: The UUID of the SAML group
      required: true
      schema:
        type: string
        format: uuid
    - name: team_uuid
      in: path
      description: The UUID of the team
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: SAML group mapped to the team
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

delete:
  operationId: deleteSamlGroupMapping
  summary: Remove the mapping of a SAML group to a team
  description: |-
    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_UPDATE` permission.
  tags:
    - SAML Groups
  parameters:
    - name: uuid
      in: path
      description: The UUID of the SAML group
      required: true
      schema:
        type: string
        format: uuid
    - name: team_uuid
      in: path
      description: The UUID of the team
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Mapping removed
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
