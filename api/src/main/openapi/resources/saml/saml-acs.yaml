post:
  operationId: consumeSamlResponse
  summary: Consume a SAML response
  description: |-
    The assertion consumer service (ACS). The identity provider sends its response here,
    via the browser, using the SAML 2.0 HTTP-POST binding.

    On success, the browser is redirected to the frontend's `/login/saml` route
    with a one-time `code`, and the `redirect` path that was passed when the login started.
    On failure, the browser is redirected to the same route with `error` set to
    `UNMAPPED_ACCOUNT` or `FAILED`. Details are only logged.
  tags:
    - SAML
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: "./schemas/consume-saml-response-request.yaml"
  responses:
    "303":
      description: Redirect to the frontend
      headers:
        Location:
          description: URL of the frontend's SAML login route
          schema:
            type: string
            format: uri
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
