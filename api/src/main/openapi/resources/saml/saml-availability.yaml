get:
  operationId: getSamlAvailability
  summary: Get SAML availability
  description: |-
    Returns whether login via SAML 2.0 is enabled and configured.
    Does not require authentication, because the login page uses it.
  tags:
    - SAML
  security: []
  responses:
    "200":
      description: The SAML availability
      content:
        application/json:
          schema:
            $ref: "./schemas/get-saml-availability-response.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
