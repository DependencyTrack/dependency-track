get:
  operationId: listSamlGroups
  summary: List SAML groups
  description: |-
    Returns a paginated list of SAML groups, ordered by name, with the teams they are mapped to.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_READ` permission.
  tags:
    - SAML
  parameters:
    - name: team_uuid
      in: query
      description: Optional UUID of a team. Only groups mapped to this team are returned.
      schema:
        type: string
        format: uuid
    - $ref: "../../shared/parameters/page-token.yaml"
    - $ref: "../../shared/parameters/pagination-limit.yaml"
  responses:
    "200":
      description: Paginated list of SAML groups
      content:
        application/json:
          schema:
            $ref: "./schemas/list-saml-groups-response.yaml"
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

post:
  operationId: createSamlGroup
  summary: Create a SAML group
  description: |-
    Creates a SAML group. The name must match a value of the groups attribute exactly.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_CREATE` permission.
  tags:
    - SAML
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/create-saml-group-request.yaml"
  responses:
    "201":
      description: SAML group created
      headers:
        Location:
          description: URL of the created SAML group
          schema:
            type: string
            format: uri
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "409":
      $ref: "../../shared/responses/generic-conflict-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
