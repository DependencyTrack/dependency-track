get:
  operationId: getSamlLogin
  summary: Start a SAML login
  description: |-
    Redirects the browser to the identity provider with a SAML 2.0 authentication request.

    The caller creates a random `code_verifier` and sends its S256 challenge as defined in RFC 7636.
    It needs the verifier to exchange the code that it receives after the login at `POST /api/v2/saml/token`.
  tags:
    - SAML
  security: []
  parameters:
    - name: code_challenge
      in: query
      description: Base64url-encoded SHA-256 hash of the code verifier, without padding
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    - name: redirect
      in: query
      description: Path of the frontend to return to after the login. Ignored when it is not a relative path.
      required: false
      schema:
        type: string
        maxLength: 2048
  responses:
    "303":
      description: Redirect to the identity provider
      headers:
        Location:
          description: URL of the identity provider, including the authentication request
          schema:
            type: string
            format: uri
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    "503":
      description: The metadata of the identity provider cannot be loaded
      content:
        application/problem+json:
          schema:
            $ref: "../../shared/schemas/problem-details.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
