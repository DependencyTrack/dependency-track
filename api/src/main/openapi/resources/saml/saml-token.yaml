post:
  operationId: createSamlToken
  summary: Exchange a SAML login code for a session token
  description: |-
    Exchanges the one-time code from a SAML login for a session token.
    The code expires after one minute and can only be used once.
    The code verifier must match the code challenge that was sent when the login started.

    Send the token in the `Authorization` header, as `Bearer <token>`.
  tags:
    - SAML
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: "./schemas/create-saml-token-request.yaml"
  responses:
    "200":
      description: The session token
      headers:
        Cache-Control:
          description: Always `no-store`
          schema:
            type: string
            maxLength: 32
      content:
        application/json:
          schema:
            $ref: "./schemas/create-saml-token-response.yaml"
    "400":
      description: >-
        The code or code verifier is missing or malformed, or the code is unknown, expired,
        or does not match the code verifier
      content:
        application/problem+json:
          schema:
            $ref: "../../shared/schemas/problem-details.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
