get:
  operationId: listSamlUsers
  summary: List SAML users
  description: |-
    Returns a paginated list of SAML users, ordered by username, with their teams.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_READ` permission.
  tags:
    - SAML Users
  parameters:
    - name: q
      description: >-
        Optional search text to filter users by.
        Filtering uses case-insensitive "contains" semantics on the username.
      in: query
      schema:
        type: string
        maxLength: 255
    - $ref: "../../shared/parameters/page-token.yaml"
    - $ref: "../../shared/parameters/pagination-limit.yaml"
  responses:
    "200":
      description: Paginated list of SAML users
      content:
        application/json:
          schema:
            $ref: "./schemas/list-saml-users-response.yaml"
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

post:
  operationId: createSamlUser
  summary: Create a SAML user
  description: |-
    Creates a SAML user, so that the user can log in when user provisioning is disabled.

    A new user has no permissions and no team memberships.
    Grant those through the REST API v1 endpoints `POST /api/v1/{permission}/user/{username}`
    and `PUT /api/v1/user/membership`.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_CREATE` permission.
  tags:
    - SAML Users
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/create-saml-user-request.yaml"
  responses:
    "201":
      description: SAML user created
      headers:
        Location:
          description: URL of the created SAML user
          schema:
            type: string
            format: uri
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "409":
      $ref: "../../shared/responses/generic-conflict-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
