type: object
properties:
  provider_name:
    type: string
    description: The name of the workload identity provider to trust the subject of. The provider must exist.
    maxLength: 63
    example: github-actions
  subject:
    type: string
    description: >-
      The `sub` claim to match. A trailing `*` makes it a prefix match,
      whose prefix must not be empty and must end with `:` or `/`.
    pattern: ^[^*]+(?:[:/]\*)?$
    maxLength: 512
    example: repo:acme/app:*
  condition:
    type: string
    description: >-
      An optional CEL expression over the token's claims that must evaluate to `true`.
      The claims are available as the `claims` map, for example `claims.ref == "refs/heads/main"`.
      Use it when the subject alone cannot express the rule.
    maxLength: 2048
    example: claims.ref == "refs/heads/main"
required:
- provider_name
- subject
