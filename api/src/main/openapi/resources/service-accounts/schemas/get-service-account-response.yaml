type: object
allOf:
- $ref: "./service-account.yaml"
properties:
  teams:
    type: array
    description: >-
      The teams the service account is a member of, ordered by name.
    items:
      $ref: "./service-account-team.yaml"
  permissions:
    type: array
    description: >-
      The permissions granted to the service account directly, ordered by name.
      Permissions it inherits from its teams are not included.
    items:
      type: string
      maxLength: 255
required:
- teams
- permissions
