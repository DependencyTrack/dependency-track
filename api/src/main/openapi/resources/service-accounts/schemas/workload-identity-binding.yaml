type: object
properties:
  uuid:
    type: string
    format: uuid
    description: The identifier of the binding.
  provider_name:
    type: string
    description: The name of the workload identity provider the binding belongs to.
    maxLength: 63
    example: github-actions
  subject:
    type: string
    description: >-
      The `sub` claim the binding matches. A trailing `*` makes it a prefix match.
    pattern: ^[^*]+(?:[:/]\*)?$
    maxLength: 512
    example: repo:acme/app:*
  condition:
    type: string
    description: >-
      A CEL expression over the token's claims that must evaluate to `true`.
      Absent when the binding matches on the subject alone.
    maxLength: 2048
    example: claims.ref == "refs/heads/main"
  created_at:
    $ref: "../../../shared/schemas/timestamp.yaml"
  last_used_at:
    allOf:
    - $ref: "../../../shared/schemas/timestamp.yaml"
    description: When a token was last exchanged through the binding. Absent when it was never used.
required:
- uuid
- provider_name
- subject
- created_at
