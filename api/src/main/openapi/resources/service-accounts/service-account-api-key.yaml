delete:
  operationId: deleteServiceAccountApiKey
  summary: Delete an API key of a service account
  description: |-
    Deletes a single API key owned by the given service account.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_DELETE` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc-` prefix
      required: true
      schema:
        $ref: "./schemas/service-account-name.yaml"
    - name: public_id
      in: path
      description: The public ID of the API key
      required: true
      schema:
        type: string
        maxLength: 8
  responses:
    "204":
      description: API key deleted
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
