get:
  operationId: listServiceAccountApiKeys
  summary: List the API keys of a service account
  description: |-
    Returns a paginated list of the API keys a service account owns, newest first.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_READ` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc-` prefix
      required: true
      schema:
        $ref: "./schemas/service-account-name.yaml"
    - $ref: "../../shared/parameters/page-token.yaml"
    - $ref: "../../shared/parameters/pagination-limit.yaml"
  responses:
    "200":
      description: Paginated list of API keys
      content:
        application/json:
          schema:
            $ref: "./schemas/list-service-account-api-keys-response.yaml"
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

post:
  operationId: createServiceAccountApiKey
  summary: Create an API key for a service account
  description: |-
    Creates a new API key owned by the given service account.

    The plain text key is returned exactly once, in the response body.
    It cannot be retrieved afterwards, because only its hash is stored.

    No API keys can be created for a suspended service account.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_CREATE` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc-` prefix
      required: true
      schema:
        $ref: "./schemas/service-account-name.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/create-service-account-api-key-request.yaml"
  responses:
    "201":
      description: API key created
      headers:
        Location:
          description: URL of the created API key
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: "./schemas/create-service-account-api-key-response.yaml"
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    "409":
      $ref: "../../shared/responses/generic-conflict-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
