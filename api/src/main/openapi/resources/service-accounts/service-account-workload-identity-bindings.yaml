get:
  operationId: listServiceAccountWorkloadIdentityBindings
  summary: List the workload identity bindings of a service account
  description: |-
    Returns a paginated list of the workload identity bindings for a service account,
    ordered by provider name and subject.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_READ` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc:` prefix
      required: true
      schema:
        $ref: "../../shared/schemas/service-account-name.yaml"
    - $ref: "../../shared/parameters/page-token.yaml"
    - $ref: "../../shared/parameters/pagination-limit.yaml"
  responses:
    "200":
      description: Paginated list of workload identity bindings
      content:
        application/json:
          schema:
            $ref: "./schemas/list-workload-identity-bindings-response.yaml"
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

post:
  operationId: createServiceAccountWorkloadIdentityBinding
  summary: Create a workload identity binding for a service account
  description: |-
    Creates a workload identity binding for a service account.

    A trailing `*` in `subject` makes it a prefix match, for example `repo:acme/app:*`.
    For `SPIFFE` providers, the prefix must end with `/`.

    For multi-tenant issuers like GitHub and GitLab, ensure that the prefix contains
    *at least* your organization to prevent cross-tenant abuse. For example:

    ```json
    {
      "provider_name": "github-actions",
      "subject": "repo:acme-inc/*"
    }
    ```

    To match a prefix within a name, add a `condition` such as `claims.sub.startsWith("repo:acme/app-")`.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_CREATE` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc:` prefix
      required: true
      schema:
        $ref: "../../shared/schemas/service-account-name.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/create-workload-identity-binding-request.yaml"
  responses:
    "201":
      description: Workload identity binding created
      headers:
        Location:
          description: URL of the created workload identity binding
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: "./schemas/create-workload-identity-binding-response.yaml"
    "400":
      description: Bad Request
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: "../../shared/schemas/invalid-cel-expression-problem-details.yaml"
              - $ref: "../../shared/schemas/invalid-request-problem-details.yaml"
              - $ref: "../../shared/schemas/problem-details.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
