get:
  operationId: getServiceAccount
  summary: Get a service account
  description: |-
    Returns details about a service account.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_READ` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc-` prefix
      required: true
      schema:
        $ref: "./schemas/service-account-name.yaml"
  responses:
    "200":
      description: The service account
      content:
        application/json:
          schema:
            $ref: "./schemas/get-service-account-response.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

patch:
  operationId: updateServiceAccount
  summary: Update a service account
  description: |-
    Updates a service account.

    Suspending an account stops its API keys from authenticating immediately.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_UPDATE` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc-` prefix
      required: true
      schema:
        $ref: "./schemas/service-account-name.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/update-service-account-request.yaml"
  responses:
    "204":
      description: Service account updated
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

delete:
  operationId: deleteServiceAccount
  summary: Delete a service account
  description: |-
    Deletes a service account.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_DELETE` permission.
  tags:
    - Service Accounts
  parameters:
    - name: name
      in: path
      description: The name of the service account, without the `svc-` prefix
      required: true
      schema:
        $ref: "./schemas/service-account-name.yaml"
  responses:
    "204":
      description: Service account deleted
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
