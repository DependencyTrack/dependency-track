get:
  operationId: listServiceAccounts
  summary: List service accounts
  description: |-
    Returns a paginated list of service accounts, ordered by name.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_READ` permission.
  tags:
    - Service Accounts
  parameters:
    - name: q
      description: >-
        Optional search text to filter service accounts by.
        Filtering uses case-insensitive "contains" semantics on the name.
      in: query
      schema:
        type: string
        maxLength: 59
    - $ref: "../../shared/parameters/page-token.yaml"
    - $ref: "../../shared/parameters/pagination-limit.yaml"
  responses:
    "200":
      description: Paginated list of service accounts
      content:
        application/json:
          schema:
            $ref: "./schemas/list-service-accounts-response.yaml"
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

post:
  operationId: createServiceAccount
  summary: Create a service account
  description: |-
    Creates a new service account.

    The account's username is the given name, prefixed with `svc-`.

    A new service account has no permissions and no team memberships.
    Grant those through the REST API v1 endpoints `POST /api/v1/{permission}/user/{username}`
    and `PUT /api/v1/user/membership`.

    Requires the `ACCESS_MANAGEMENT` or `ACCESS_MANAGEMENT_CREATE` permission.
  tags:
    - Service Accounts
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/create-service-account-request.yaml"
  responses:
    "201":
      description: Service account created
      headers:
        Location:
          description: URL of the created service account
          schema:
            type: string
            format: uri
    "400":
      $ref: "../../shared/responses/invalid-request-error.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "409":
      $ref: "../../shared/responses/generic-conflict-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
