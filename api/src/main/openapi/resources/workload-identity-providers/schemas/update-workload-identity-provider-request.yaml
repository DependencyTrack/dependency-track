type: object
properties:
  issuer:
    type: string
    description: >-
      The expected `iss` claim for `OIDC` providers,
      or the SPIFFE trust domain for `SPIFFE` providers, such as `example.org`.
    maxLength: 255
    example: https://token.actions.githubusercontent.com
  audience:
    type: string
    description: The value that the token's `aud` claim must contain.
    maxLength: 255
    example: https://dependency-track.example.com
  jwks_url:
    type: string
    description: The URL to fetch the signing keys from. Must be `https`.
    maxLength: 2048
    example: https://example.org/keys
  jwks:
    type: object
    description: An RFC 7517 JSON Web Key Set holding the issuer's public signing keys.
    additionalProperties: true
  session_lifetime_seconds:
    type: integer
    format: int32
    description: The lifetime of sessions created through this provider, unless a binding sets its own.
    minimum: 60
    maximum: 86400
    example: 3600
