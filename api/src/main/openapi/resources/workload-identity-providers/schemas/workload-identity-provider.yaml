type: object
properties:
  name:
    $ref: "../../../shared/schemas/workload-identity-provider-name.yaml"
  type:
    $ref: "./workload-identity-provider-type.yaml"
  issuer:
    type: string
    description: >-
      The expected `iss` claim for `OIDC` providers,
      or the SPIFFE trust domain for `SPIFFE` providers.
    maxLength: 255
    example: https://token.actions.githubusercontent.com
  audience:
    type: string
    description: The value that the token's `aud` claim must contain.
    maxLength: 255
    example: https://dependency-track.example.com
  jwks_url:
    type: string
    description: >-
      The URL the signing keys are fetched from.
      For `OIDC` providers, this is the `jwks_uri` resolved from the issuer's discovery document.
      Absent when the keys were provided inline.
    maxLength: 2048
  jwks_key_ids:
    type: array
    description: The key IDs of the inline key set. Absent when the keys are fetched from a URL.
    maxItems: 64
    items:
      type: string
      maxLength: 255
  session_lifetime_seconds:
    type: integer
    format: int32
    description: The lifetime of sessions created through this provider, unless a binding sets its own.
    minimum: 60
    maximum: 86400
    example: 3600
  created_at:
    $ref: "../../../shared/schemas/timestamp.yaml"
required:
- name
- type
- issuer
- audience
- session_lifetime_seconds
- created_at
