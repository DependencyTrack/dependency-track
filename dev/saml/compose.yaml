# Local environment for trying out SAML login, with Keycloak as identity provider.
# See README.md in this directory.
name: dtrack-saml

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      # Fixed hostname, so that the metadata contains URLs that the browser can reach,
      # even when the API server fetches it from inside the Docker network.
      KC_HOSTNAME: "http://localhost:8180"
      KC_HEALTH_ENABLED: "true"
    ports:
    - "127.0.0.1:8180:8080"
    volumes:
    - "./keycloak:/opt/keycloak/data/import:ro"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3" ]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "dtrack"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
    - "postgres-data:/var/lib/postgresql"

  apiserver:
    image: "ghcr.io/dependencytrack/apiserver:${DT_APISERVER_VERSION:-saml-local}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DT_BCRYPT_ROUNDS: "4"
      DT_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      DT_DATASOURCE_USERNAME: "dtrack"
      DT_DATASOURCE_PASSWORD: "dtrack"
      DT_TELEMETRY_SUBMISSION_DEFAULT_ENABLED: "false"
      DT_SAML_ENABLED: "true"
      DT_SAML_SP_ENTITY_ID: "dependency-track"
      DT_SAML_SP_ACS_URL: "http://localhost:8080/api/v2/saml/acs"
      DT_SAML_FRONTEND_URL: "http://localhost:8088"
      DT_SAML_IDP_METADATA_URL: "http://keycloak:8080/realms/dtrack/protocol/saml/descriptor"
      DT_SAML_EMAIL_ATTRIBUTE: "email"
      DT_SAML_GROUPS_ATTRIBUTE: "groups"
      DT_SAML_USER_PROVISIONING: "true"
      DT_SAML_TEAM_SYNCHRONIZATION: "true"
      DT_SAML_GROUP_PROVISIONING: "true"
    ports:
    - "127.0.0.1:8080:8080"
    volumes:
    - "apiserver-data:/data"

  frontend:
    image: "ghcr.io/dependencytrack/frontend:${DT_FRONTEND_VERSION:-saml-local}"
    environment:
      API_BASE_URL: "http://localhost:8080"
      SAML_ENABLED: "true"
      SAML_LOGIN_BUTTON_TEXT: "Login with Keycloak (SAML)"
    ports:
    - "127.0.0.1:8088:8080"

volumes:
  apiserver-data: {}
  postgres-data: {}
