syntax = "proto3";

package org.dependencytrack.internal.workflow.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "org.dependencytrack.proto.internal.workflow.v1";

message ResolvePackageHealthMetadataWorkflowArg {
  optional string cursor = 1;
}

message FetchPackageHealthMetadataCandidatesArg {
  optional string cursor = 1;
}

message FetchPackageHealthMetadataCandidatesRes {
  repeated string purls = 1;
  optional string next_cursor = 2;
  bool has_more = 3;
}

message ResolvePackageHealthMetadataActivityArg {
  repeated string purls = 1;
  // Packages whose deps.dev data is already stored, and that only need their GitHub repository data.
  repeated PackageHealthGitHubFetch github_fetches = 2;
}

message ResolvePackageHealthMetadataActivityRes {
  repeated string changed_purls = 1;
  // Packages that were not fetched because the deps.dev rate limit was reached.
  repeated string unresolved_purls = 2;
  // When the earliest rate limit of unresolved_purls and pending_github_fetches resets.
  // Set if and only if one of them is not empty.
  google.protobuf.Timestamp rate_limit_reset_at = 3;
  // Packages whose deps.dev data was stored, but whose GitHub repository data was not fetched
  // because the GitHub rate limit was reached.
  repeated PackageHealthGitHubFetch pending_github_fetches = 4;
}

message PackageHealthGitHubFetch {
  // Package URL without version, qualifiers, or subpath.
  string purl = 1;
  // Repository as returned by deps.dev, for example github.com/owner/repo.
  string repository = 2;
}

message ScheduleHealthPolicyEvaluationsArg {
  repeated string purls = 1;
}
